[project]
name = "voxflow-local-engine"
version = "0.1.0"
description = "Local FunASR and machine-translation engine for VoxFlow"
requires-python = ">=3.10"
dependencies = [
  "funasr>=1.3",
  "modelscope>=1.20",
  "sentencepiece>=0.2",
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
